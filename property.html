
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | Haven Property Solutions</title>
  <meta name="description" content="View property photos, prices, locations and full details at Haven Property Solutions.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #1b2b42;
    }

    header {
      background: #142b46;
      color: #e6c783;
      padding: 20px;
      border-bottom: 4px solid #c5a15b;
    }

    header a {
      color: #e6c783;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 20px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .gallery-main {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      background: #142b46;
      border-radius: 10px;
      cursor: zoom-in;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin: 12px 0;
      padding: 4px;
    }

    .thumbnails img {
      width: 90px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      border: 3px solid transparent;
    }

    .thumbnails img.active {
      border-color: #c5a15b;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #142b46;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 7px;
      padding: 12px 18px;
      background: #142b46;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      margin: 5px 5px 5px 0;
    }

    .button.gold {
      background: #c5a15b;
      color: #142b46;
    }

    .message {
      padding: 16px;
      background: #fff;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #555;
    }

    @media (max-width: 600px) {
      main {
        margin: 12px auto;
        padding: 12px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="./">← Haven Property Solutions</a>
    <p>Property details</p>
  </header>

  <main>
    <div id="property-content" class="message">
      Loading property details...
    </div>
  </main>

  <footer>
    © Haven Property Solutions
  </footer>
  
<script>
const API_URL =
  "https://haven-property-solutions-api.onrender.com/api/properties";

const content = document.getElementById("property-content");

function getPropertyId() {
  return new URLSearchParams(window.location.search).get("id");
}

function addDetail(label, value) {
  if (value === undefined || value === null || value === "") return;

  const row = document.createElement("div");
  row.className = "detail-row";

  const strong = document.createElement("strong");
  strong.textContent = label + ": ";

  const text = document.createElement("span");
  text.textContent = String(value);

  row.append(strong, text);
  content.appendChild(row);
}

async function loadPropertyDetails() {
  try {
    const id = getPropertyId();

    if (!id) {
      content.textContent =
        "No property was selected. Please return to the property listings.";
      return;
    }

    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Could not load the property listings.");
    }

    const data = await response.json();
    const properties = Array.isArray(data.properties)
      ? data.properties
      : [];

    const property = properties.find(item =>
      String(item._id || item.id || "") === id &&
      String(item.status || "").toLowerCase() === "published"
    );

    if (!property) {
      content.textContent =
        "This property could not be found or is no longer available.";
      return;
    }

    content.replaceChildren();

    const title = document.createElement("h1");
    title.textContent = property.title || "Property details";
    content.appendChild(title);

    const images = Array.isArray(property.images)
      ? property.images.filter(url =>
          typeof url === "string" && url.trim()
        )
      : [];

    if (images.length) {
      const mainPhoto = document.createElement("img");
      mainPhoto.className = "gallery-main";
      mainPhoto.src = images[0];
      mainPhoto.alt = property.title || "Property photo";

      const thumbnails = document.createElement("div");
      thumbnails.className = "thumbnails";

      images.forEach((url, index) => {
        const thumbnail = document.createElement("img");
        thumbnail.src = url;
        thumbnail.alt = "Property photo " + (index + 1);

        if (index === 0) thumbnail.classList.add("active");

        thumbnail.addEventListener("click", () => {
          mainPhoto.src = url;
          thumbnails.querySelectorAll("img").forEach(item =>
            item.classList.remove("active")
          );
          thumbnail.classList.add("active");
        });

        thumbnails.appendChild(thumbnail);
      });

      mainPhoto.addEventListener("click", () => {
        const viewer = document.createElement("div");
        viewer.style.cssText =
          "position:fixed;inset:0;background:rgba(0,0,0,.94);" +
          "display:flex;align-items:center;justify-content:center;" +
          "padding:16px;z-index:99999;cursor:zoom-out";

        const largePhoto = document.createElement("img");
        largePhoto.src = mainPhoto.src;
        largePhoto.alt = mainPhoto.alt;
        largePhoto.style.cssText =
          "max-width:100%;max-height:100%;object-fit:contain";

        viewer.appendChild(largePhoto);
        viewer.addEventListener("click", () => viewer.remove());
        document.body.appendChild(viewer);
      });

      content.append(mainPhoto, thumbnails);
    }

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = property.price != null
      ? "KSh " + Number(property.price).toLocaleString("en-KE") +
        (property.pricePeriod ? "/" + property.pricePeriod : "")
      : "Contact us for price";
    content.appendChild(price);

    addDetail("Location", property.location);
    if (property.location && String(property.location).trim()) {
  const mapSection = document.createElement("div");
  mapSection.style.margin = "20px 0";

  const mapHeading = document.createElement("h2");
  mapHeading.textContent = "Property Location";

  const mapFrame = document.createElement("iframe");
  mapFrame.title = "Map showing property location";
  mapFrame.loading = "lazy";
  mapFrame.width = "100%";
  mapFrame.height = "300";
  mapFrame.style.border = "0";
  mapFrame.style.borderRadius = "10px";

  const mapQuery = String(property.location).trim();

  mapFrame.src =
    "https://maps.google.com/maps?q=" +
    encodeURIComponent(mapQuery) +
    "&output=embed";

  const mapLink = document.createElement("a");
  mapLink.href =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(mapQuery);
  mapLink.target = "_blank";
  mapLink.rel = "noopener noreferrer";
  mapLink.className = "button";
  mapLink.textContent = "Open Location in Google Maps";
  mapLink.style.marginTop = "10px";

  mapSection.append(mapHeading, mapFrame, mapLink);
  content.appendChild(mapSection);
}
    addDetail("Listing type", property.listingPurpose);
    addDetail("Description", property.description);
    addDetail("Bedrooms", property.bedrooms);
    addDetail("Bathrooms", property.bathrooms);
    addDetail("Property type", property.propertyType);

    // Land details
    addDetail("Land size", property.landSize || "");
    addDetail("Land measurement unit", property.landUnit);
    addDetail("Land use", property.landUse);
    addDetail("Title deed status", property.titleDeed);

    // Rental inventory
    addDetail("Rental arrangement", property.rentalArrangement);
    addDetail("Total rooms or units",
      property.totalRentalUnits ?? "");
    addDetail("Available rooms or units",
      property.availableRentalUnits ?? "");

    // Airbnb / short-stay details
    addDetail("Nightly rate", property.nightlyRate
      ? "KSh " + Number(property.nightlyRate).toLocaleString("en-KE")
      : "");
    addDetail("Maximum guests", property.maxGuests ?? "");
    addDetail("Guest capacity", property.guestCapacity ?? "");
    addDetail("Minimum nights", property.minimumNights ?? "");
    addDetail("Check-in", property.checkInTime);
    addDetail("Check-out", property.checkOutTime);
    addDetail("Amenities", property.stayAmenities);
    addDetail("Check-in information", property.checkInInfo);

    const backLink = document.createElement("a");
    backLink.href = "./";
    backLink.className = "button";
    backLink.textContent = "Back to listings";
    content.appendChild(backLink);

    const contact = document.createElement("a");
    contact.href =
      "https://wa.me/?text=" +
      encodeURIComponent(
        "Hello, I am interested in " +
        (property.title || "this property") +
        " in " + (property.location || "your listings") + "."
      );
    contact.target = "_blank";
    contact.rel = "noopener noreferrer";
    contact.className = "button gold";
    contact.textContent = "Enquire on WhatsApp";
    content.appendChild(contact);
    const shareButton = document.createElement("button");
shareButton.type = "button";
shareButton.className = "button";
shareButton.textContent = "Share Property";

shareButton.addEventListener("click", async () => {
  const shareText =
    "Check out " + (property.title || "this property") +
    " in " + (property.location || "our listings") + ".";

  try {
    if (navigator.share) {
      await navigator.share({
        title: property.title || "Haven Property Solutions",
        text: shareText,
        url: window.location.href
      });
    } else {
      window.prompt(
        "Copy this property link to share:",
        window.location.href
      );
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      window.prompt(
        "Copy this property link to share:",
        window.location.href
      );
    }
  }
});

content.appendChild(shareButton);

const whatsappShare = document.createElement("a");
whatsappShare.className = "button gold";
whatsappShare.textContent = "Share on WhatsApp";
whatsappShare.href =
  "https://wa.me/?text=" +
  encodeURIComponent(
    "Check out " + (property.title || "this property") +
    " in " + (property.location || "our listings") + ": " +
    window.location.href
  );
whatsappShare.target = "_blank";
whatsappShare.rel = "noopener noreferrer";

content.appendChild(whatsappShare);
    const enquirySection = document.createElement("section");
enquirySection.style.marginTop = "24px";
enquirySection.style.padding = "18px";
enquirySection.style.border = "1px solid #e4d8bd";
enquirySection.style.borderRadius = "10px";

const enquiryHeading = document.createElement("h2");
enquiryHeading.textContent = "Enquire About This Property";

const enquiryIntro = document.createElement("p");
enquiryIntro.textContent =
  "Send us your details and message about this property.";

const enquiryForm = document.createElement("form");

enquiryForm.innerHTML = `
  <label for="enquiry-name">Your name</label>
  <input id="enquiry-name" name="name"
    type="text" maxlength="100" required>

  <label for="enquiry-email">Email address (optional)</label>
  <input id="enquiry-email" name="email"
    type="email" maxlength="254">

  <label for="enquiry-phone">Phone number (optional)</label>
  <input id="enquiry-phone" name="phone"
    type="tel" maxlength="30">

  <label for="enquiry-message">Your enquiry</label>
  <textarea id="enquiry-message" name="message"
    maxlength="2000" rows="5" required></textarea>

  <button type="submit" class="button gold">
    Send Enquiry
  </button>
`;

enquiryForm.querySelectorAll("input, textarea").forEach(field => {
  field.style.width = "100%";
  field.style.padding = "12px";
  field.style.marginBottom = "12px";
  field.style.boxSizing = "border-box";
});

const enquiryStatus = document.createElement("p");
enquiryStatus.setAttribute("role", "status");
enquiryStatus.setAttribute("aria-live", "polite");

enquiryForm.addEventListener("submit", async event => {
  event.preventDefault();

  const name =
    enquiryForm.elements.namedItem("name").value.trim();
  const email =
    enquiryForm.elements.namedItem("email").value.trim();
  const phone =
    enquiryForm.elements.namedItem("phone").value.trim();
  const message =
    enquiryForm.elements.namedItem("message").value.trim();

  if (!email && !phone) {
    enquiryStatus.textContent =
      "Please provide an email address or phone number.";
    return;
  }

  const propertyId = String(property._id || property.id || "");

  if (!propertyId) {
    enquiryStatus.textContent =
      "Unable to identify this property. Please contact us through WhatsApp.";
    return;
  }

  const submitButton = enquiryForm.querySelector(
    'button[type="submit"]'
  );
  submitButton.disabled = true;
  enquiryStatus.textContent = "Sending your enquiry...";

  try {
    const enquiryResponse = await fetch(
      "https://haven-property-solutions-api.onrender.com/api/enquiries",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          propertyId,
          name,
          email,
          phone,
          message
        })
      }
    );

    const enquiryResult = await enquiryResponse.json();

    if (!enquiryResponse.ok) {
      throw new Error(
        enquiryResult.message || "Unable to send your enquiry."
      );
    }

    enquiryStatus.textContent =
      "Thank you! Your enquiry has been submitted successfully.";
    enquiryForm.reset();
  } catch (error) {
    enquiryStatus.textContent =
      error.message || "Unable to send your enquiry. Please try again.";
  } finally {
    submitButton.disabled = false;
  }
});

enquirySection.append(
  enquiryHeading,
  enquiryIntro,
  enquiryForm,
  enquiryStatus
);

content.appendChild(enquirySection);

  } catch (error) {
    content.textContent =
      "Unable to load property details. Please try again later.";
  }
}

loadPropertyDetails();
</script>
</body>
</html>

</body>
</html>
