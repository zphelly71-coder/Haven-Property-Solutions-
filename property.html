<script>
const API_URL = window.location.hostname.endsWith(".onrender.com")
  ? "/api/properties"
  : "https://haven-property-solutions-api.onrender.com/api/properties";
const content = document.getElementById("property-content");

function getPropertyId() {
  return new URLSearchParams(window.location.search).get("id");
}

function addDetail(label, value) {
  if (value === undefined || value === null || value === "") return;

  const row = document.createElement("div");
  row.className = "detail-row";

  const strong = document.createElement("strong");
  strong.textContent = label + ": ";

  const text = document.createElement("span");
  text.textContent = String(value);

  row.append(strong, text);
  content.appendChild(row);
}

async function loadPropertyDetails() {
  try {
    const id = getPropertyId();

    if (!id) {
      content.textContent =
        "No property was selected. Please return to the property listings.";
      return;
    }

    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Could not load the property listings.");
    }

    const data = await response.json();
    const properties = Array.isArray(data.properties)
      ? data.properties
      : [];

    const property = properties.find(item =>
      String(item._id || item.id || "") === id &&
      String(item.status || "").toLowerCase() === "published"
    );

    if (!property) {
      content.textContent =
        "This property could not be found or is no longer available.";
      return;
    }

    content.replaceChildren();

    const title = document.createElement("h1");
    title.textContent = property.title || "Property details";
    content.appendChild(title);

    const images = Array.isArray(property.images)
      ? property.images.filter(url =>
          typeof url === "string" && url.trim()
        )
      : [];

    if (images.length) {
      const mainPhoto = document.createElement("img");
      mainPhoto.className = "gallery-main";
      mainPhoto.src = images[0];
      mainPhoto.alt = property.title || "Property photo";

      const thumbnails = document.createElement("div");
      thumbnails.className = "thumbnails";

      images.forEach((url, index) => {
        const thumbnail = document.createElement("img");
        thumbnail.src = url;
        thumbnail.alt = "Property photo " + (index + 1);

        if (index === 0) thumbnail.classList.add("active");

        thumbnail.addEventListener("click", () => {
          mainPhoto.src = url;
          thumbnails.querySelectorAll("img").forEach(item =>
            item.classList.remove("active")
          );
          thumbnail.classList.add("active");
        });

        thumbnails.appendChild(thumbnail);
      });

      mainPhoto.addEventListener("click", () => {
        const viewer = document.createElement("div");
        viewer.style.cssText =
          "position:fixed;inset:0;background:rgba(0,0,0,.94);" +
          "display:flex;align-items:center;justify-content:center;" +
          "padding:16px;z-index:99999;cursor:zoom-out";

        const largePhoto = document.createElement("img");
        largePhoto.src = mainPhoto.src;
        largePhoto.alt = mainPhoto.alt;
        largePhoto.style.cssText =
          "max-width:100%;max-height:100%;object-fit:contain";

        viewer.appendChild(largePhoto);
        viewer.addEventListener("click", () => viewer.remove());
        document.body.appendChild(viewer);
      });

      content.append(mainPhoto, thumbnails);
    }

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = property.price != null
      ? "KSh " + Number(property.price).toLocaleString("en-KE") +
        (property.pricePeriod ? "/" + property.pricePeriod : "")
      : "Contact us for price";
    content.appendChild(price);

    addDetail("Location", property.location);
    if (property.location && String(property.location).trim()) {
  const mapSection = document.createElement("div");
  mapSection.style.margin = "20px 0";

  const mapHeading = document.createElement("h2");
  mapHeading.textContent = "Property Location";

  const mapFrame = document.createElement("iframe");
  mapFrame.title = "Map showing property location";
  mapFrame.loading = "lazy";
  mapFrame.width = "100%";
  mapFrame.height = "300";
  mapFrame.style.border = "0";
  mapFrame.style.borderRadius = "10px";

  const mapQuery = String(property.location).trim();

  mapFrame.src =
    "https://maps.google.com/maps?q=" +
    encodeURIComponent(mapQuery) +
    "&output=embed";

  const mapLink = document.createElement("a");
  mapLink.href =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(mapQuery);
  mapLink.target = "_blank";
  mapLink.rel = "noopener noreferrer";
  mapLink.className = "button";
  mapLink.textContent = "Open Location in Google Maps";
  mapLink.style.marginTop = "10px";

  mapSection.append(mapHeading, mapFrame, mapLink);
  content.appendChild(mapSection);
}
    addDetail("Listing type", property.listingPurpose);
  addDetail("Description", property.description);

const propertyType = String(property.propertyType || "").toLowerCase();
const listingPurpose = String(property.listingPurpose || "").toLowerCase();

const isLand = propertyType.includes("land") ||
  propertyType.includes("plot");

const isRental = listingPurpose === "rent" ||
  listingPurpose === "lease";

const isShortStay = listingPurpose === "short-stay";

// Display property information using the original detail-row style
addDetail("Property type", property.propertyType);

if (!isLand && !isShortStay) {
  addDetail("Bedrooms", property.bedrooms);
  addDetail("Bathrooms", property.bathrooms);
}
    
    // Show only land-specific details for land / plot listings.
    if (isLand) {
      addDetail("Land size", property.landSize);
      addDetail("Land measurement unit", property.landUnit);
      addDetail("Land use", property.landUse);
      addDetail("Title deed status", property.titleDeed);
    } else if (isShortStay) {
      // Airbnb / short-stay details only.
      addDetail("Nightly rate", property.nightlyRate != null
        ? "KSh " + Number(property.nightlyRate).toLocaleString("en-KE")
        : "");
      addDetail("Maximum guests", property.maxGuests);
      addDetail("Guest capacity", property.guestCapacity);
      addDetail("Minimum nights", property.minimumNights);
      addDetail("Check-in", property.checkInTime);
      addDetail("Check-out", property.checkOutTime);
      // Display short-stay amenities as individual labels
if (property.stayAmenities) {
  const amenitiesSection = document.createElement("section");
  amenitiesSection.className = "amenities-section";

  const amenitiesHeading = document.createElement("h2");
  amenitiesHeading.textContent = "Property Amenities";

  const amenitiesList = document.createElement("div");
  amenitiesList.className = "amenities-list";

  const amenities = Array.isArray(property.stayAmenities)
    ? property.stayAmenities
    : String(property.stayAmenities).split(",");

  amenities.forEach(item => {
    const amenity = String(item).trim();

    if (amenity) {
      const amenityTag = document.createElement("span");
      amenityTag.className = "amenity-item";
      amenityTag.textContent = amenity;
      amenitiesList.appendChild(amenityTag);
    }
  });

  if (amenitiesList.children.length) {
    amenitiesSection.append(amenitiesHeading, amenitiesList);
    content.appendChild(amenitiesSection);
  }
}
      addDetail("Check-in information", property.checkInInfo);
    } else if (isRental) {
      // Rental inventory only.
      // Rental inventory and availability
addDetail("Rental arrangement", property.rentalArrangement);
addDetail("Total rooms or units", property.totalRentalUnits);

const hasUnitCounts =
  property.totalRentalUnits !== null &&
  property.totalRentalUnits !== undefined &&
  property.totalRentalUnits !== "" &&
  property.availableRentalUnits !== null &&
  property.availableRentalUnits !== undefined &&
  property.availableRentalUnits !== "";

const totalUnits = Number(property.totalRentalUnits);
const availableUnits = Number(property.availableRentalUnits);

if (
  hasUnitCounts &&
  Number.isInteger(totalUnits) &&
  Number.isInteger(availableUnits) &&
  totalUnits >= 0 &&
  availableUnits >= 0 &&
  availableUnits <= totalUnits
) {
  addDetail(
    "Available rooms or units",
    availableUnits + " of " + totalUnits
  );

  const availability = document.createElement("div");
  availability.className = "detail-row";

  const status = document.createElement("strong");

  if (totalUnits === 0) {
    status.textContent = "Availability not yet provided";
  } else if (availableUnits === 0) {
    status.textContent =
      "Fully occupied — enquire about upcoming vacancies.";
  } else if (availableUnits === totalUnits) {
    status.textContent = "All units currently available";
  } else {
    status.textContent =
      availableUnits + " unit(s) currently available — enquire to arrange a viewing.";
  }

  availability.appendChild(status);
  content.appendChild(availability);
}
    }


    const backLink = document.createElement("a");
    backLink.href = "./";
    backLink.className = "button";
    backLink.textContent = "Back to listings";
    content.appendChild(backLink);

    const contact = document.createElement("a");
    contact.href =

    "Check out " + (property.title || "this property") +

  try {
    if (navigator.share) {
      await navigator.share({
        title: property.title || "Haven Property Solutions",
        text: shareText,
        url: window.location.href
      });
    } else {
      window.prompt(
        "Copy this property link to share:",

    }
  } catch (error) {

        "Copy this property link to share:",

});

if (isShortStay) {

  const reservationSection = document.createElement("section");

  reservationSection.style.marginTop = "16px";
  reservationSection.style.padding = "18px";
  reservationSection.style.border = "1px solid #e4d8bd";
  reservationSection.style.borderRadius = "10px";

  const reservationHeading = document.createElement("h2");
  reservationHeading.textContent = "Request a Reservation";

  const reservationIntro = document.createElement("p");
  reservationIntro.textContent =
    "Submit your preferred dates and guest details. We will review your request and contact you. No payment is required at this stage.";

  const reservationForm = document.createElement("form");

  reservationForm.innerHTML = `
    <label for="reservation-name">Your name</label>
    <input id="reservation-name" name="name"
      type="text" maxlength="100" required>

    <label for="reservation-email">Email address (optional)</label>
    <input id="reservation-email" name="email"
      type="email" maxlength="254">

    <label for="reservation-phone">Phone number (optional)</label>
    <input id="reservation-phone" name="phone"
      type="tel" maxlength="30">

    <label for="reservation-checkin">Check-in date</label>
    <input id="reservation-checkin" name="checkInDate"
      type="date" required>

    <label for="reservation-checkout">Check-out date</label>
    <input id="reservation-checkout" name="checkOutDate"
      type="date" required>

    <label for="reservation-guests">Number of guests</label>
    <input id="reservation-guests" name="guestCount"
      type="number" min="1" max="50" step="1" required>

    <label for="reservation-requests">Special requests (optional)</label>
    <textarea id="reservation-requests" name="specialRequests"
      maxlength="1000" rows="4"></textarea>

    <button type="submit" class="button gold">
      Submit Reservation Request
    </button>
  `;

  reservationForm.querySelectorAll("input, textarea").forEach(field => {
    field.style.width = "100%";
    field.style.padding = "12px";
    field.style.marginBottom = "12px";
    field.style.boxSizing = "border-box";
  });

  const checkInField =
    reservationForm.elements.namedItem("checkInDate");
  const checkOutField =
    reservationForm.elements.namedItem("checkOutDate");

  const todayInKenya = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Nairobi"
  }).format(new Date());

  checkInField.min = todayInKenya;
  checkOutField.min = todayInKenya;

  checkInField.addEventListener("change", () => {
    checkOutField.min = checkInField.value || todayInKenya;

    if (
      checkOutField.value &&
      checkOutField.value <= checkInField.value
    ) {
      checkOutField.value = "";
    }
  });

  const reservationStatus = document.createElement("p");
  reservationStatus.setAttribute("role", "status");
  reservationStatus.setAttribute("aria-live", "polite");

  reservationButton.addEventListener("click", () => {
    reservationSection.hidden = !reservationSection.hidden;
    reservationButton.textContent = reservationSection.hidden
      ? "Make Reservation"
      : "Close Reservation Form";
  });

  reservationForm.addEventListener("submit", async event => {
    event.preventDefault();

    const name =
      reservationForm.elements.namedItem("name").value.trim();
    const email =
      reservationForm.elements.namedItem("email").value.trim();
    const phone =
      reservationForm.elements.namedItem("phone").value.trim();

    if (!email && !phone) {
      reservationStatus.textContent =
        "Please provide an email address or phone number.";
      return;
    }

    const propertyId = String(property._id || property.id || "");

    if (!propertyId) {
      reservationStatus.textContent =
        "Unable to identify this property. Please contact us through WhatsApp.";
      return;
    }

    const submitButton = reservationForm.querySelector(
      'button[type="submit"]'
    );

    submitButton.disabled = true;
    reservationStatus.textContent = "Submitting your reservation request...";

    try {
      const response = await fetch(
        "https://haven-property-solutions-api.onrender.com/api/reservations",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            propertyId,
            name,
            email,
            phone,
            checkInDate: checkInField.value,
            checkOutDate: checkOutField.value,
            guestCount: Number(
              reservationForm.elements.namedItem("guestCount").value
            ),
            specialRequests:
              reservationForm.elements.namedItem("specialRequests").value.trim()
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.message || "Unable to submit your reservation request."
        );
      }

      reservationStatus.textContent =
        "Your reservation request has been submitted successfully. It is pending review. No payment is required yet.";

      reservationForm.reset();
      checkInField.min = todayInKenya;
      checkOutField.min = todayInKenya;

    } catch (error) {
      reservationStatus.textContent =
        error.message || "Unable to submit your request. Please try again.";
    } finally {
      submitButton.disabled = false;
    }
  });

  reservationSection.append(
    reservationHeading,
    reservationIntro,
    reservationForm,
    reservationStatus
  );

  content.append(reservationButton, reservationSection);
}
