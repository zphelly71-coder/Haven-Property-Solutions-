
name: Check Haven API JavaScript Syntax

on:
  workflow_dispatch:
  push:
    paths:
      - "server.js"
      - "package.json"

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check server.js syntax
        run: node --check server.js
